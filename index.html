<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>足球雷达 · 盘口时间板</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">FR</span><span>足球雷达<small>MARKET TIMELINE</small></span></a>
    <div class="header-meta"><span class="live-dot"></span><span id="last-updated">载入中</span><span class="source-pill">SPORTTERY · OFFICIAL</span></div>
  </header>
  <main class="shell">
    <section class="hero">
      <div class="hero-copy"><p class="eyebrow">MATCHDAY / 2026.08.22</p><h1>把每一次变盘<br /><em>留在时间线上。</em></h1><p class="hero-note">按联赛拆开每场比赛，盘口、水位、进球数和比分赔率只比较本场自身变化。</p></div>
      <div class="hero-stats"><div><strong id="match-count">—</strong><span>场次</span></div><div><strong id="snapshot-count">—</strong><span>时间点</span></div><div><strong id="changed-count">—</strong><span>有变化</span></div></div>
    </section>
    <section class="toolbar" aria-label="比赛筛选"><label class="search"><span>⌕</span><input id="search" placeholder="搜索球队、编号或联赛" /></label><select id="league-filter"><option value="all">全部联赛</option></select><select id="status-filter"><option value="all">全部状态</option><option value="Selling">未开赛</option><option value="started">已开赛 / 完场</option></select><button id="reset" class="ghost-btn">重置</button></section>
    <section id="league-groups" class="league-groups"></section>
    <footer class="site-footer">以上仅为公开信息整理后的娱乐分析，不构成任何购彩建议，请理性参考。<span>数据缺失会明确标注，不用猜测填充。</span></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
